services:
  - type: web
    name: skyjo-game
    env: python
    region: oregon
    plan: free
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn --config gunicorn_config.py run:app
    envVars:
      - key: FLASK_CONFIG
        value: production
      - key: SECRET_KEY
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: skyjo-db
          property: connectionString
      - key: PYTHON_VERSION
        value: 3.11.0

databases:
  - name: skyjo-db
    plan: free
    databaseName: skyjo
    user: skyjo
