{% extends "base.html" %}

{% block title %}Skyjo - Home{% endblock %}

{% block content %}
<header>
    <h1 data-i18n="home_title">Skyjo</h1>
    <p class="subtitle" data-i18n="home_subtitle">The card game</p>
</header>

<main>
    <div class="menu">
        <a href="{{ url_for('game.create') }}" class="btn btn-primary" data-i18n="create_game">Create Game</a>
        <a href="{{ url_for('game.join') }}" class="btn btn-secondary" data-i18n="join_game">Join Game</a>
        <a href="{{ url_for('game.lobbies') }}" class="btn btn-secondary" data-i18n="public_lobbies">Public Lobbies</a>
    </div>
</main>

<footer>
    <p data-i18n="footer_text">Built with Flask & SocketIO</p>
    <p style="font-size: 0.7em; color: #888;">v1.1 - Auto-deploy enabled ✓</p>
</footer>
{% endblock %}
