<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}Skyjo{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
    {% block extra_css %}{% endblock %}
</head>
<body>
    <!-- Navbar -->
    <nav class="navbar">
        <a href="{{ url_for('main.index') }}" class="navbar-link" data-translate="home">Home</a>
        <a href="https://github.com/littlecrakage/skyjo-game" target="_blank" class="navbar-link">GitHub</a>
    </nav>
    
    <!-- Language Switcher -->
    <button id="lang-btn" class="lang-switcher" onclick="toggleLang()">🇫🇷 FR</button>
    
    <div class="container">
        {% block content %}{% endblock %}
    </div>
    
    <script src="{{ url_for('static', filename='js/translations.js') }}"></script>
    {% block scripts %}{% endblock %}
</body>
</html>
